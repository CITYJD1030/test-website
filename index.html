<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的第一个网站</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="container">
            <div class="logo">MyWebsite</div>
            <ul class="nav-links">
                <li><a href="#home">首页</a></li>
                <li><a href="#features">功能</a></li>
                <li><a href="#contact">联系</a></li>
            </ul>
        </div>
    </nav>

    <!-- 欢迎区域 -->
    <section id="home" class="hero">
        <div class="container">
            <h1>欢迎来到我的网站</h1>
            <p>这是一个用 Zeabur 部署的静态网站</p>
            <button class="cta-button">开始探索</button>
        </div>
    </section>

    <!-- 功能介绍 -->
    <section id="features" class="features">
        <div class="container">
            <h2>主要功能</h2>
            <div class="features-grid">
                <div class="feature-card">
                    <h3>⚡ 快速</h3>
                    <p>静态网站加载速度极快</p>
                </div>
                <div class="feature-card">
                    <h3>🔒 安全</h3>
                    <p>自动 HTTPS 加密保护</p>
                </div>
                <div class="feature-card">
                    <h3>📱 响应式</h3>
                    <p>在任何设备上都能完美显示</p>
                </div>
            </div>
        </div>
    </section>

    <!-- 联系区域 -->
    <section id="contact" class="contact">
        <div class="container">
            <h2>联系我们</h2>
            <p>有任何问题？随时与我们联系</p>
            <a href="mailto:your-email@example.com" class="contact-button">发送邮件</a>
        </div>
    </section>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 我的网站。保留所有权利。</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
